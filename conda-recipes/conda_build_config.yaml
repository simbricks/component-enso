# Shared variables consumed by every recipe in this repo via
#   conda build -m conda-recipes/conda_build_config.yaml <recipe>
#
# NOTE: simbricks_version is the single source of truth for the conda package
# versions built from this repo and the internal bin -> python `==` pin (the
# simbricks-qemu-bin recipe pins the simbricks-qemu-python package it is co-built
# with to this exact version). It MUST stay in sync with the version in
# simbricks-qemu-python/pyproject.toml (that file drives the actual version of the
# built python wheel). External dependencies (e.g. simbricks-lib) are NOT tied to
# this version; they carry their own `>=` bounds since they release independently.

simbricks_version:
  - "0.4.2"
homepage:
  - "https://www.simbricks.io/"
github_org:
  - "https://github.com/simbricks/simbricks"
