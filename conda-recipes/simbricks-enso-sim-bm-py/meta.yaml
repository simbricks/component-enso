{% set name = "simbricks-enso-sim-bm-py" %}

package:
  name: {{ name|lower }}
  version: {{ simbricks_version }}

source:
  path: ../../enso_sim_bm_py

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.12
    - simbricks-orchestration >=0.6.0
    - simbricks-utils >=0.6.0
    - simbricks-enso-sys-py =={{ simbricks_version }}

test:
  imports:
    - simbricks.components.enso.simulation.behavioral

about:
  home: {{ homepage }}
  license: MIT
  license_family: MIT
  license_file: ../../LICENSE
  summary: Ensō NIC behavioral model integration into SimBricks
  dev_url: {{ github_org }}

extra:
  recipe-maintainers:
    - Team SimBricks <team@simbricks.io>
